server {
    listen 80;
    server_name localhost;

    index main.html;

    types {
        text/html                   html htm;
        text/css                    css;
        application/javascript      js;
        application/json            json;
        image/png                   png;
        image/jpeg                  jpg jpeg jfif;
        image/webp                  webp;
        image/gif                   gif;
        image/svg+xml               svg;
        audio/mpeg                  mp3;
        video/mp4                   mp4;
        application/octet-stream    bin;
    }

    location / {
        root /var/www/html;
        try_files $uri $uri/ /main.html;
    }

    location /JS/ {
        alias /var/www/js/;
    }

    location /CSS/ {
        alias /var/www/css/;
    }

    location /Assets/ {
        alias /var/www/assets/;
    }

    location /Intro/ {
        alias /var/www/intro/;
    }

    location /Music/ {
        alias /var/www/music/;
    }

    add_header Cache-Control "no-cache, no-store, must-revalidate";
}