server {
    listen 80;
    server_name localhost;

    index main.html;

    types {
        text/html                   html htm;
        text/css                    css;
        application/javascript      js;
        application/json            json;
        image/png                   png;
        image/jpeg                  jpg jpeg jfif;
        image/webp                  webp;
        image/gif                   gif;
        image/svg+xml               svg;
        audio/mpeg                  mp3;
        video/mp4                   mp4;
        application/octet-stream    bin;
    }

    # Bare .html links (e.g. href="cards.html")
    location ~* ^/([^/]+\.html)$ {
        root /var/www/html;
        try_files /$1 =404;
    }

    # HTML pages (root)
    location / {
        root /var/www/html;
        try_files $uri $uri/ /main.html;
    }

    # Relative paths (../CSS/, ../JS/, ../Api/)
    location /CSS/ {
        alias /var/www/css/;
    }

    location /JS/ {
        alias /var/www/js/;
    }

    location /Api/ {
        alias /var/www/api/;
    }

    location /Assets/ {
        alias /var/www/assets/;
    }

    location /Intro/ {
        alias /var/www/intro/;
    }

    location /Music/ {
        alias /var/www/music/;
    }

    # Absolute paths (/Z_Attack/CSS/, /Z_Attack/JS/, /Z_Attack/Api/)
    location /Z_Attack/CSS/ {
        alias /var/www/css/;
    }

    location /Z_Attack/JS/ {
        alias /var/www/js/;
    }

    location /Z_Attack/Api/ {
        alias /var/www/api/;
    }

    location /Z_Attack/Assets/ {
        alias /var/www/assets/;
    }

    # Full path links (/Z_Attack/HTML/cards.html)
    location /Z_Attack/HTML/ {
        alias /var/www/html/;
    }

    add_header Cache-Control "no-cache, no-store, must-revalidate";
}