<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Anime Cafe</title>
    <link rel="stylesheet" href="catCafe.css">
</head>

<body>

    <div class="Header">
        <h1>EVA Cafe</h1>
    </div>

    <marquee behavior="alternate" direction="right" scrollamount="10">
        <img src="rei-chiquita-rei-dance.gif">
    </marquee>

    <div id="par1" class="Content">
        <p>Welcome to the EVA cafe</p>
        <p>MENU (Lunes - Descuento)</p>
        <div class="item">
            Shinji's Americano: 35$
            <img src="shinji.jpg" class="img-hover">
        </div>

        <div class="item">
            Asuka's Macchiato: 45$
            <img src="asuka.jpg" class="img-hover">
        </div>

        <div class="item">
            Misato's beer: 80$
            <img src="misato.jpg" class="img-hover">
        </div>

        <div class="item">
            Angels Expresso: 15$
            <img src="expreso.jpg" class="img-hover">
        </div>    
    </div>

    <div style="text-align:center;">
        <label for="dia">Selecciona un día:</label><br>
        <select id="dia" name="dia">
            <option value="lunes">Lunes</option>
            <option value="martes">Martes</option>
            <option value="miercoles">Miércoles</option>
            <option value="juebebes">Juebebes</option>
            <option value="viernes">Viernes</option>
            <option value="sabado">Sábado</option>
            <option value="domingo">Domingo</option>
        </select>
    </div>

    <marquee behavior="alternate" scrollamount="30">
        <marquee behavior="alternate" scrollamount="30" direction="down">
            <img src="maxwell-cat.gif">
        </marquee>       
    </marquee>

    <div style="text-align: center;">
        <button id="changeBtn">Change Background</button>
    </div>

    <div style="text-align:center;">
        <audio id="Music" autoplay loop hidden>
            <source src="1. FLY ME TO THE MOON.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="Footer">
        <h6>derechos reservados</h6>
    </div>

    
    <script src="catCafe.js"></script>

</body>
</html>
