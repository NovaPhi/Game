services:

  db:
    image: mariadb:11
    container_name: zattack_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./BaseDatos/DB-Schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init/02-cards.sql:/docker-entrypoint-initdb.d/02-cards.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  api:
    build: .
    container_name: zattack_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${API_PORT:-8081}:8081"

  frontend:
    image: nginx:alpine
    container_name: zattack_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./Z_Attack/HTML:/var/www/html:ro
      - ./Z_Attack/JS:/var/www/js:ro
      - ./Z_Attack/CSS:/var/www/css:ro
      - ./Z_Attack/Assets:/var/www/assets:ro
      - ./Intro:/var/www/intro:ro
      - ./Music:/var/www/music:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data: