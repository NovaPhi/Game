s<!DOCTYPE html>
<html>

    <head>

        <link rel="stylesheet" href="/Z_Attack/CSS/LogIn.css">

    <body>

        <nav id="topBar">

        </nav>

        <div id="pageBody">
            <div id="loginCard">
                <h1>Login</h1>

                <div id="fields">
                    <div class="field">

                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password">
                    </div>
                </div>

                <button id="btnSignin">Sign In</button>

                <div id="divider">
                    <div class="line"></div>
                    <span>or</span>
                    <div class="line"></div>
                </div>

                <a href="SignUp.html" id="btnCreate">Create Account</a>

            </div>
        </div>
        <script src="../Api/LogIn.js"></script>

</html>
