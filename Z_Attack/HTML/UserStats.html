<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Stats</title>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../CSS/UserStats.css"/>
</head>
<body>

  <a href="main.html" class="back-btn">← Back</a>
  <nav id="topBar">
    <span id="authBtn"></span>
  </nav>

  <h1 class="welcome">Welcome, <span id="usernameDisplay"></span></h1>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Stat</th>
          <th>Value</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Games Played</td><td id="gamesPlayed"></td></tr>
        <tr><td>Best Score</td><td id="wins">—</td></tr>
        <tr><td>Best Level</td><td id="losses">—</td></tr>
        <tr><td>Playtime</td><td id="Playtime">—</td></tr>
      </tbody>
    </table>
  </div>

  <button class="logout-btn" onclick="logout()">Logout</button>

  <button class="logout-btn" onclick="deleteAccount()">Delete Account</button>


  <script src="../Api/UserStats.js"></script>
</body>
</html>
