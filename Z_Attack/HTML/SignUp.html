<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        
        <link rel="stylesheet" href="/Z_Attack/CSS/LogIn.css">
        <link rel="stylesheet" href="../CSS/ColorblindChnge.css"/>
    </head>

    <body>
        <nav id="topBar">
            <a class="nav-btn" href="main.html">Home</a>
        </nav>

        <div id="pageBody">
            <div id="loginCard">
                <h1>Sign Up</h1>
                <p class="subtitle">Join the undead</p>

                <div id="fields">
                    <div class="field">
                        <label for="Email">Email</label>
                        <input type="text" id="email" name="email"><br>
                    </div>
                    <div class="field">
                        <label for="Username">Username</label>
                        <input type="text" id="Username" name="Username"><br>
                    </div>
                    <div class="field">
                        <label for="Password">Password</label>
                        <input type="password" id="password" name="password"><br>
                    </div>
                </div>

                <button id="btnCreate">Create Account</button>

            </div>
        </div>
        <script src="../Api/SignUp.js"></script>
    </body>
</html>
