<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Attack — Leaderboard</title>

    <link rel="stylesheet" href="../CSS/main.css">
    <link rel="stylesheet" href="../CSS/ColorblindChnge.css"/>
    <link rel="stylesheet" href="../CSS/leaderboard.css"> <!-- NUEVO -->
</head>

<body>
    <div id="leaderboard-wrapper">
        <h1 id="leaderboard-title">Leaderboard</h1>

        <p id="loading-msg">Loading...</p>
        <p id="error-msg" style="display:none;">Failed to load leaderboard.</p>

        <table id="leaderboard-table" style="display:none;">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Player</th>
                    <th>Best Score</th>
                    <th>Best Level</th>
                    <th>Total XP</th>
                    <th>Runs</th>
                    <th>Playtime</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
        </table>

        <a id="back-btn" href="main.html">← Back to Menu</a>
    </div>

    <script>
        function formatPlaytime(seconds) { // Function to have time displayed correctly (helped by AI)
            if (!seconds) return '—';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            if (h > 0) return `${h}h ${m}m`;
            return `${m}m`;
        }

        function rankLabel(i) { // FUnction to have an emoji for the first three placements (helped by AI)
            if (i === 0) return '🥇';
            if (i === 1) return '🥈';
            if (i === 2) return '🥉';
            return i + 1;
        }

        async function loadLeaderboard() { // Function that loads the leaderboard from the database (logic made by ourselfs but helped by AI)
            const loadingMsg = document.getElementById('loading-msg');
            const errorMsg   = document.getElementById('error-msg');
            const table      = document.getElementById('leaderboard-table');
            const tbody      = document.getElementById('leaderboard-body');

            const stored = localStorage.getItem('sessionUser');
            const sessionUser = stored ? JSON.parse(stored) : null;
            const myUsername  = sessionUser ? sessionUser.username : null;

            try {
                const res  = await fetch('http://localhost:8081/leaderboard');
                const data = await res.json();

                if (!data.success || !data.leaderboard) throw new Error('Bad response');

                loadingMsg.style.display = 'none';
                table.style.display      = 'table';

                data.leaderboard.forEach((row, i) => {
                    const tr = document.createElement('tr');

                    if (i === 0) tr.classList.add('rank-1');
                    else if (i === 1) tr.classList.add('rank-2');
                    else if (i === 2) tr.classList.add('rank-3');

                    if (myUsername && row.username === myUsername) {
                        tr.classList.add('rank-me');
                    }

                    tr.innerHTML = `
                        <td>${rankLabel(i)}</td>
                        <td>${row.username}</td>
                        <td>${row.best_score.toLocaleString()}</td>
                        <td>${row.best_level}</td>
                        <td>${row.total_xp.toLocaleString()}</td>
                        <td>${row.total_runs}</td>
                        <td class="playtime-cell">${formatPlaytime(row.playtime)}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                loadingMsg.style.display = 'none';
                errorMsg.style.display   = 'block';
                console.error('Leaderboard error:', err);
            }
        }

        loadLeaderboard();
    </script>

    <script src="../Api/leaderboard.js"></script>
</body>
</html>
